<svg xmlns="http://www.w3.org/2000/svg" width="480" height="196" viewBox="0 0 480 196" role="img" aria-label="City Plainte — Civic complaints">
<title>City Plainte — Civic complaints</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes pulse { 0%,100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }

  .shine { animation: shine 5s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-40px); } 60%,100% { transform: translateX(150px); } }
  .live { animation: breathe 2.6s ease-in-out infinite; }
</style>

<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#C98A3C"/><stop offset=".55" stop-color="#B23A2E"/><stop offset="1" stop-color="#2E4057"/></linearGradient></defs>
<rect width="480" height="196" rx="18" fill="#12151A" stroke="#2A313B"/>
<clipPath id="bc"><rect x="28" y="0" width="120" height="3" rx="1.5"/></clipPath>
<rect x="28" y="0" width="120" height="3" rx="1.5" fill="url(#acc)"/>
<g clip-path="url(#bc)"><rect class="shine" x="28" y="0" width="30" height="3" fill="#FFFFFF" fill-opacity=".55"/></g>
<text class="sans t" x="28" y="44" font-size="22" font-weight="650" fill="#EDE0C8">City Plainte</text>
<text class="mono t" x="28" y="66" font-size="12" letter-spacing="1" fill="#C98A3C">CIVIC COMPLAINTS</text>

<text class="sans d" x="28" y="98" font-size="14" fill="#8B95A1">Citizens report local issues and follow</text><text class="sans d" x="28" y="118" font-size="14" fill="#8B95A1">how they are handled.</text>
<g><rect x="28" y="150" width="60" height="24" rx="12" fill="#2E4057" fill-opacity=".55" stroke="#2E4057"/><text class="mono" x="58" y="166" font-size="11.5" fill="#EDE0C8" text-anchor="middle">Django</text></g><g><rect x="96.4" y="150" width="60" height="24" rx="12" fill="#2E4057" fill-opacity=".55" stroke="#2E4057"/><text class="mono" x="127" y="166" font-size="11.5" fill="#EDE0C8" text-anchor="middle">Python</text></g><g><rect x="164.8" y="150" width="90" height="24" rx="12" fill="#2E4057" fill-opacity=".55" stroke="#2E4057"/><text class="mono" x="210" y="166" font-size="11.5" fill="#EDE0C8" text-anchor="middle">JavaScript</text></g>
</svg>
