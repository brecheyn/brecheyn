<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Right now">
<title>Right now</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes pulse { 0%,100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
.p { animation: pulse 2.8s ease-in-out infinite; }</style>

<rect width="1000" height="150" rx="18" fill="#12151A" stroke="#2A313B"/>
<text class="mono" x="32" y="30" font-size="12" letter-spacing="2" fill="#C98A3C">RIGHT NOW</text>
<circle class="p" style="animation-delay:0.0s" cx="38" cy="58" r="4" fill="#C98A3C"/><text class="sans" x="54" y="63" font-size="17" font-weight="650" fill="#EDE0C8">Offline-first apps</text><text class="sans" x="54" y="90" font-size="13.5" fill="#8B95A1">Sync queues that survive bad</text><text class="sans" x="54" y="111" font-size="13.5" fill="#8B95A1">connectivity — the network is not a given.</text><circle class="p" style="animation-delay:0.6s" cx="358" cy="58" r="4" fill="#C98A3C"/><text class="sans" x="374" y="63" font-size="17" font-weight="650" fill="#EDE0C8">Edge intelligence</text><text class="sans" x="374" y="90" font-size="13.5" fill="#8B95A1">Bringing small AI models closer</text><text class="sans" x="374" y="111" font-size="13.5" fill="#8B95A1">to the sensors.</text><circle class="p" style="animation-delay:1.2s" cx="678" cy="58" r="4" fill="#C98A3C"/><text class="sans" x="694" y="63" font-size="17" font-weight="650" fill="#EDE0C8">Security</text><text class="sans" x="694" y="90" font-size="13.5" fill="#8B95A1">Network analysis, threat basics,</text><text class="sans" x="694" y="111" font-size="13.5" fill="#8B95A1">and things that fail safely.</text>
</svg>
