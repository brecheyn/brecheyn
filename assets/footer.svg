<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="Footer">
<title>Footer</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes pulse { 0%,100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }

  .w1 { animation: drift 18s linear infinite; }
  .w2 { animation: drift 26s linear infinite reverse; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-200px); } }
</style>

