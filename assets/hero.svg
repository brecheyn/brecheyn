<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Pharès Nadinga — full-stack developer, IoT &amp; AI engineer">
<title>Pharès Nadinga — full-stack developer, IoT &amp; AI engineer</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes pulse { 0%,100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }

  .card { fill: url(#bg); }
  .glow { animation: breathe 9s ease-in-out infinite; }
  .role { animation: roles 12s ease-in-out infinite; }
  @keyframes roles { 0%,27% { opacity: 1; transform: translateY(0); } 33%,94% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: translateY(0); } }
  .weave { animation: slide 14s linear infinite; }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1F26"/><stop offset="1" stop-color="#12151A"/></linearGradient>
  <radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#C98A3C" stop-opacity=".55"/><stop offset="1" stop-color="#C98A3C" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1000" height="300" rx="22"/></clipPath>
</defs>
